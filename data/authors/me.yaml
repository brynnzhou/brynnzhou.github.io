bio: |
  Zuyuan is a researcher with a background in landscape architecture. She earned her PhD in Architecture from the [**National University of Singapore**](https://www.nus.edu.sg/), advised by [**Prof. Tan Puay Yok**](https://cde.nus.edu.sg/arch/staffs/tan-puay-yok-dr/) and [**Prof. Lau Siu Kit**](https://cde.nus.edu.sg/arch/staffs/lau-siu-kit-eddie-dr/).

  Her research investigates audio-visual interactions and their influence on perceptual, psychological, and physiological responses, with a particular focus on soundscapes, natural sounds, and greenery. Her broader research interests include design visualization and auralization, human–environment interactions, and the roles of landscape and soundscape characteristics in environmental restorativeness and human health and well-being.

  You can find more about her background in her [**CV**](/uploads/resume.pdf).

